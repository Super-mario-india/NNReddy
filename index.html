 ${FL('f_amenities','Facilities, separated by commas','text',h.amenities)}${TA('f_timings','Timings, one per line: Breakfast | 7:30 to 9:00 AM',(h.timings||[]).map(t=>t.join(' | ')).join('\n'),'rows="5"')}${TA('f_rules','House rules, one per line',(h.rules?.length?h.rules:TERMS).join('\n'),'rows="7"')}${FL('f_notice','Notice banner (optional), e.g. Admissions open for December','text',h.notice)}${TA('f_description','About this hostel',h.description&&h.description!=='None'?h.description:'')}

A.hSave=async d=>{if(!val('f_name'))fail('f_name','Hostel name is required');if(val('f_image_url')&&!safe(val('f_image_url')))fail('f_image_url','The image link must start with https://');const p={id:d.id||undefined,kind:picked('f_kind')};['name','city','phone','address','maps_url','image_url','amenities','description','fee','deposit','timings','rules','notice'].forEach(k=>p[k]=$('#f_'+k).value);
 const h=await api('save_hostel',p);await reload('hs');S.hs=null;toast('Hostel saved');rerender();if(!d.id){A.hForm({id:h.id});toast('Saved. Now add photos.')}else closeSheet()};
A.hDel=async d=>{const h=S.AD.hs.find(x=>x.id===d.id);if(!confirm(`Delete ${h?.name||'this hostel'}?\n\nIts floors, beds and photos are removed too. Hostels with applications cannot be deleted.`))return;await api('del_hostel',{id:d.id});closeSheet();await reload('hs');S.hs=null;toast('Hostel deleted');rerender()};
function shrink(file,max=1600,q=.82){return new Promise((ok,no)=>{const u=URL.createObjectURL(file),i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);let d=c.toDataURL('image/jpeg',q);if(d.length>1.15e6)d=c.toDataURL('image/jpeg',.65);ok(d)};i.onerror=()=>{URL.revokeObjectURL(u);no(new Error(`Could not read ${file.name}. Try a JPG or PNG.`))};i.src=u})}
A.phAdd=async(d,t)=>{const files=[...t.files].filter(f=>f.type.startsWith('image/'));t.value='';if(!files.length)return;const h=S.AD.hs.find(x=>x.id===d.h),room=8-(h.image_ids||[]).length;if(files.length>room)toast(`Only ${room} more photo${room===1?'':'s'} fit. Adding the first ${room}.`,1);
 let n=0;for(const f of files.slice(0,room)){toast(`Uploading photo ${++n} of ${Math.min(files.length,room)}…`);await api('upload_image',{hostel_id:d.h,data:await shrink(f)})}await reload('hs');S.hs=null;toast('Photos added');A.hForm({id:d.h});rerender()};
A.phCover=async d=>{const h=S.AD.hs.find(x=>x.id===d.h),ids=[...h.image_ids],[x]=ids.splice(+d.i,1);ids.unshift(x);await api('set_images',{hostel_id:d.h,images:ids});await reload('hs');S.hs=null;toast('Cover photo updated');A.hForm({id:d.h});rerender()};
A.phDel=async d=>{if(!confirm('Remove this photo?'))return;const h=S.AD.hs.find(x=>x.id===d.h),ids=h.image_ids.filter((_,i)=>i!==+d.i);await api('set_images',{hostel_id:d.h,images:ids});await reload('hs');S.hs=null;toast('Photo removed');A.hForm({id:d.h});rerender()};

 <div class="g2">${FL('m_user','Gmail address','email',s.user)}${FL('m_pass','Gmail app password','password',s.pass,'autocomplete="new-password"')}</div>${FL('m_from','Sender, e.g. N.N Reddy Hostels <you@gmail.com> (optional)','text',s.from)}${FL('m_admin_email','Send new-application alerts to','email',s.admin_email)}${FL('m_site_url','Website address','url',s.site_url||location.origin)}

/* database */
const DBT=['applications','payments','tickets','hostels','floors','beds','bookings'];
function aDb(){const D=S.AD.db,AD=S.AD,hist=JSON.parse(ls('nnr-sql')||'[]');AD.bt=AD.bt||'applications';
 const cons=D.console==='on'?`<div class="card pd"><div class="r" style="margin-bottom:12px"><h3 style="margin:0">SQL console</h3>${chip('--ok','On')}</div><p class="fine" style="margin:0 0 12px">Runs any SQL on your Supabase database: create tables, add columns, select, update. Changes are logged. Ctrl+Enter runs.</p>
  ${S.dbKey?'':FL('db_k','Console key (DB_CONSOLE_KEY)','password','','autocomplete="off"')}<textarea class="fi mono" id="sql" spellcheck="false" aria-label="SQL" placeholder="select name, status, created_at from applications order by created_at desc limit 20">${esc(AD.sql||'')}</textarea>
  <label class="ck"><input type="checkbox" id="db_ok"><span>I understand this can change or delete data</span></label><div class="row8"><button class="btn bp" data-act="dbRun">${I('play',15)}Run</button>${hist.length?`<span class="mu" style="font-size:13px">Recent:</span>${hist.slice(0,6).map((h,i)=>`<button class="chip" style="cursor:pointer;max-width:200px;overflow:hidden;text-overflow:ellipsis" data-act="dbHist" data-i="${i}" title="${esc(h)}">${esc(h.slice(0,40))}</button>`).join('')}`:''}</div><div id="dbout" style="margin-top:14px">${AD.dbOut||''}</div></div>`
  :`<div class="card pd"><div class="r" style="margin-bottom:10px"><h3 style="margin:0">SQL console</h3>${chip('--na','Off')}</div><p class="mu" style="font-size:14px">${D.console==='no_function'?'The console key is set, but the database part is not installed. Run the update SQL above once.':'To run any SQL from here (create tables, change columns, fix data):'}</p>${D.console==='off'?`<ol class="mu" style="font-size:14px;padding-left:20px;margin-top:8px;display:grid;gap:6px"><li>Run the update SQL above in Supabase (once).</li><li>In Vercel, add an environment variable <b>DB_CONSOLE_KEY</b> with a long secret (12+ characters, different from the admin password), then redeploy.</li><li>Come back here and type that key to run SQL.</li></ol>`:''}</div>`;
 return`<div class="ph"><h1>Database</h1><p>Supabase tables, updates and SQL.</p></div>
 ${D.ok?'':`<div class="note warn" style="margin:0 0 14px">${I('info',20)}<div><b>Update needed.</b> Some tables or columns are missing. Copy the update SQL below and run it once in Supabase${D.console==='on'?', or run it here':''}.</div></div>`}
 <div class="sec">Tables</div><div class="tbl-grid">${Object.entries(D.tables).map(([t,n])=>`<div class="card ${n==null?'miss':''} ${DBT.includes(t)?'tap':''}" ${DBT.includes(t)?tapA('dbTable',t,`data-t="${t}"`):''}><small>${t}</small><b>${n==null?'Missing':n.toLocaleString('en-IN')}</b><span class="mu" style="font-size:12px">${n==null?'run the update':'rows'}</span></div>`).join('')}<div class="card ${D.rent?'':'miss'}"><small>applications.rent</small><b>${D.rent?'Ready':'Missing'}</b><span class="mu" style="font-size:12px">monthly rent column</span></div></div>
 <div class="sec">Update SQL</div><div class="card pd"><p class="fine" style="margin:0 0 10px">Safe to run more than once. Adds anything new this version needs without touching your data.</p><pre class="code">${esc(D.sql)}</pre><div class="row8"><button class="btn bp bm" data-act="dbCopy">${I('copy',15)}Copy SQL</button><a class="btn bs bm" href="${esc(D.editor)}" target="_blank" rel="noopener noreferrer">${I('ext',15)}Open Supabase SQL editor</a>${D.console==='on'?`<button class="btn bs bm" data-act="dbUpdate">${I('play',15)}Run it here</button>`:''}</div></div>
 <div class="sec">SQL console</div>${cons}
 <div class="sec">Browse <button data-act="dbCsv">${I('dl',14)} Export CSV</button></div><div class="tbar">${segH('dbTable',DBT.map(t=>[t,t]),AD.bt)}</div><div id="dbrows"><div class="sk" style="height:200px"></div></div>
 ${AD.audit?.length?`<div class="sec">Console log</div><div class="card pd">${AD.audit.slice(0,20).map(r=>`<div class="li"><span style="font-family:ui-monospace,Menlo,monospace;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:70%">${esc(r.sql)}</span><b style="font-size:12.5px;color:var(${r.ok?'--ok':'--occ'})">${r.ok?'OK':'Failed'} · ${dt(r.at)}</b></div>`).join('')}</div>`:''}`}
const cell=v=>v==null?'':typeof v==='object'?JSON.stringify(v):String(v);
function dataTable(rows,act,title){if(!rows.length)return'<div class="card empty">No rows.</div>';const cols=[...new Set(rows.slice(0,50).flatMap(Object.keys))];S.AD[act]=rows;S.AD[act+'T']=title;
 return`<div class="tw"><table class="dt"><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.map((r,i)=>`<tr data-act="${act}" data-i="${i}" tabindex="0">${cols.map(c=>`<td title="${esc(cell(r[c]).slice(0,300))}">${esc(cell(r[c]).slice(0,80))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
async function dbLoad(more){const AD=S.AD,el=$('#dbrows');if(!el)return;const off=more?AD.brows.length:0,r=await api('db_rows',{table:AD.bt,offset:off});AD.brows=more?AD.brows.concat(r.rows):r.rows;
 el.innerHTML=dataTable(AD.brows,'dbRow',AD.bt)+(r.more?`<button class="btn bs bw" style="margin-top:10px" data-act="dbMore">Load more</button>`:'')}
A.dbTable=async d=>{S.AD.bt=d.t||d.v||d.id;if(!$('#dbrows'))return;$$('.seg [data-act=dbTable]').forEach(b=>b.classList.toggle('on',b.dataset.v===S.AD.bt));syncAll();$('#dbrows').scrollIntoView({behavior:'smooth',block:'start'});await dbLoad()};
A.dbMore=()=>dbLoad(1);
const rowSheet=k=>d=>{const r=S.AD[k][+d.i];S.AD.copyRow=r;sheet(S.AD[k+'T'],String(r.id||r.key||''),`<pre class="code" style="max-height:none;white-space:pre-wrap;word-break:break-word">${esc(JSON.stringify(r,null,2))}</pre><button class="btn bs bw" data-act="dbCopyRow">${I('copy',15)}Copy</button>`)};
A.dbRow=rowSheet('dbRow');A.sqlRow=rowSheet('sqlRow');
A.dbCopyRow=async()=>{await navigator.clipboard.writeText(JSON.stringify(S.AD.copyRow,null,2));toast('Copied')};
A.dbCopy=async()=>{await navigator.clipboard.writeText(S.AD.db.sql);toast('SQL copied. Paste it in the Supabase SQL editor and press Run.')};
A.dbCsv=()=>{const rows=S.AD.brows||[];if(!rows.length)throw new Error('Nothing to export yet');const cols=[...new Set(rows.flatMap(Object.keys))],q=v=>`"${cell(v).replace(/"/g,'""')}"`;
 const b=new Blob(['\ufeff'+[cols.map(q).join(','),...rows.map(r=>cols.map(c=>q(r[c])).join(','))].join('\r\n')],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`${S.AD.bt}-${today()}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4e3)};
A.dbHist=d=>{$('#sql').value=JSON.parse(ls('nnr-sql')||'[]')[+d.i]||'';$('#sql').focus()};
async function dbExec(sql,confirmed){if(!S.dbKey){const k=val('db_k');if(!k)fail('db_k','Enter the console key');S.dbKey=k}
 try{return await api('db_sql',{sql,key:S.dbKey,confirm:confirmed?1:0})}catch(e){if(e.status===403&&/key/i.test(e.message)){S.dbKey='';rerender()}throw e}}
A.dbRun=async()=>{const sql=val('sql');S.AD.sql=sql;if(!sql)fail('sql','Type some SQL first');const r=await dbExec(sql,$('#db_ok')?.checked);
 const h=[sql,...JSON.parse(ls('nnr-sql')||'[]').filter(x=>x!==sql)].slice(0,20);ls('nnr-sql',JSON.stringify(h));
 S.AD.dbOut=r.rows?`<div class="row8" style="margin-bottom:8px">${chip('--ok',`${r.total} row${r.total===1?'':'s'}${r.total>1000?' (first 1000 shown)':''}`)}<span class="mu" style="font-size:12.5px">${r.ms} ms</span></div>${dataTable(r.rows,'sqlRow','Result row')}`:`<div class="note" style="margin:0">${I('check',18)}<div>Done in ${r.ms} ms.</div></div>`;
 if(r.rows){$('#dbout').innerHTML=S.AD.dbOut;return}S.AD.db=await api('db_status');S.AD.audit=await api('db_audit');rerender();toast('Done')};
A.dbUpdate=async()=>{if(!await confirmUI('Run the database update?','Adds the new tables and columns this version needs. Your data is not changed.','Run update'))return;await dbExec(S.AD.db.sql,true);S.AD.db=await api('db_status');S.AD.audit=await api('db_audit');await reload('R');rerender();toast('Database updated')};

const BK={pending:['--hold','Under review'],approved:['--res','Approved'],confirmed:['--ok','Confirmed'],checked_in:['--ok','Checked in'],checked_out:['--na','Checked out'],rejected:['--occ','Rejected'],cancelled:['--occ','Cancelled']};

 <div class="ac">${NEXT(b).map(n=>`<button class="btn ${n[2]} bm" data-act="bkGo" data-id="${esc(b.id)}" data-s="${n[0]}">${n[1]}</button>`).join('')}</div></div>`).join('')||'<div class="card empty">No old bookings.</div>'}`}

/* ---------- router ---------- */
function go(h){location.hash===h?setTimeout(router):location.hash=h}

 closeSheet();A.lbClose();bar();S.mode=p[0]==='admin'?'admin':'user';$('#app').classList.toggle('wide',S.mode==='admin');document.title='N.N Reddy Hostels';head();navbar(p);scrollTo(0,0);
 try{if(p[0]==='h'&&p[1])await hostelPage(p[1]);else if(p[0]==='me')await mePage(p[1]||'stay');else if(p[0]==='admin')await adminPage(p[1]||'overview');else await homePage()}
 catch(e){if(e!==STALE&&rt===S.rt)view(`<div style="margin-top:30px">${lockC('Something went wrong',e.message,`<button class="btn bp" style="margin-top:16px" data-act="retry">Try again</button>`,'info')}</div>`)}
 if(rt===S.rt){navbar(p);if(p[0]==='admin'&&p[1]==='db'&&S.AD?.db)dbLoad().catch(e=>toast(e.message,1))}}

addEventListener('hashchange',()=>{if(skipHash){skipHash=0;return}
 if(window.PE?.dirty&&lastHash.startsWith('#/admin/plans')&&!location.hash.startsWith('#/admin/plans')){if(!confirm('Discard unsaved changes on this floor?')){skipHash=1;location.hash=lastHash;return}PE.reset()}
 lastHash=location.hash;router()});
head();router();

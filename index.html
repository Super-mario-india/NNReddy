<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>N.N Reddy Hostels</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1110;--s1:#111a18;--s2:#16211f;--ln:#243430;--tx:#efe9dc;--mut:#8f9d97;--sand:#d8b98a;--sand2:#f0dcb6;--ok:#52c9a3;--hold:#e6a94a;--res:#8091ff;--occ:#e8627c;--na:#4c5753}
*{box-sizing:border-box;margin:0}
body{font:14px/1.6 Manrope,system-ui,sans-serif;color:var(--tx);min-height:100vh;background:radial-gradient(1100px 560px at 85% -8%,#1b2a24 0,transparent 62%),radial-gradient(800px 480px at -8% 12%,#16201f 0,transparent 55%),var(--bg)}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:500;letter-spacing:-.01em;line-height:1.15}
a{color:inherit}
.ic{flex:none;vertical-align:-3px}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px}
.nav{position:sticky;top:0;z-index:20;backdrop-filter:blur(14px);background:rgba(11,17,16,.78);border-bottom:1px solid var(--ln)}
.nav .wrap{display:flex;align-items:center;height:66px;gap:26px}
.logo{display:flex;align-items:center;gap:11px;font-family:Fraunces,serif;font-size:21px;text-decoration:none}
.logo i{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(145deg,var(--sand2),#a98450);color:#1a1409}
.nav nav{margin-left:auto;display:flex;gap:6px}
.nav nav a{padding:8px 14px;border-radius:99px;color:var(--mut);text-decoration:none;display:flex;gap:7px;align-items:center}
.nav nav a:hover{color:var(--tx);background:var(--s2)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:12px;border:1px solid var(--ln);background:var(--s2);color:var(--tx);font:600 13.5px Manrope;cursor:pointer;text-decoration:none;transition:.15s}
.btn:hover{border-color:#3a4f48}.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--sand);outline-offset:2px}
.btn.g{background:linear-gradient(145deg,var(--sand2),#b08d57);color:#1a1409;border:0}.btn.g:hover{filter:brightness(1.06)}
.btn.o{background:transparent}.btn.sm{padding:6px 12px;font-size:12.5px;border-radius:9px}.btn:disabled{opacity:.5;cursor:wait}
.hero{padding:76px 0 40px}.hero h1{font-size:clamp(42px,7vw,84px);max-width:11em}.hero p{color:var(--mut);font-size:17px;max-width:34em;margin-top:18px}
.srch{margin-top:30px;display:flex;gap:10px;max-width:460px}
input,select,textarea{width:100%;background:var(--s1);border:1px solid var(--ln);color:var(--tx);border-radius:11px;padding:11px 14px;font:inherit}
textarea{min-height:84px;resize:vertical}label{display:block;color:var(--mut);font-size:12.5px;margin:0 0 6px;font-weight:600}
.grid{display:grid;gap:22px;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));padding:20px 0 70px}
.card{background:linear-gradient(180deg,var(--s2),var(--s1));border:1px solid var(--ln);border-radius:20px;overflow:hidden}
.hc{text-decoration:none;display:block;transition:.2s}.hc:hover{transform:translateY(-3px);border-color:#3c524a}
.img{height:190px;background:#1a2a25 center/cover;display:grid;place-items:center;color:#3e5a50}
.hc .b{padding:18px 20px 20px}.hc h3{font-size:24px}.meta{color:var(--mut);display:flex;gap:8px;align-items:center;margin-top:6px}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding-top:14px;border-top:1px solid var(--ln)}
.chip{display:inline-flex;gap:6px;align-items:center;padding:3px 11px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--ln);color:var(--mut);background:var(--s1)}
.chip.ok{color:var(--ok);border-color:#255a49}.chip.w{color:var(--hold);border-color:#6a4f1f}.chip.b{color:var(--occ);border-color:#6a2b3a}.chip.i{color:var(--res);border-color:#34407a}.chip.s{color:var(--sand);border-color:#5f4e2f}
.ph{height:340px;background:#1a2a25 center/cover;border-radius:24px;position:relative;margin-top:26px;border:1px solid var(--ln)}
.ph::after{content:"";position:absolute;inset:0;border-radius:24px;background:linear-gradient(0deg,rgba(11,17,16,.92),transparent 60%)}
.ph div{position:absolute;left:30px;bottom:26px;z-index:1}.ph h1{font-size:clamp(34px,5vw,58px)}
.two{display:grid;gap:22px;grid-template-columns:1.2fr 1fr;margin-top:22px}
.pad{padding:24px}.pad h3{font-size:22px;margin-bottom:12px}.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.map iframe{width:100%;height:290px;border:0;display:block;filter:grayscale(.35) contrast(1.05)}
.mapbar{display:flex;gap:12px;justify-content:space-between;align-items:center;padding:14px 18px;border-top:1px solid var(--ln)}.mapbar span{color:var(--mut);font-size:13px}
.sec{margin:46px 0 14px;display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap}.sec h2{font-size:34px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tabs .btn.on{background:var(--sand);color:#1a1409;border-color:var(--sand)}
.plan{width:100%;height:auto;display:block;background:#0d1514;border-radius:16px;touch-action:none}
.pl{padding:12px}.leg{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;color:var(--mut);font-size:12.5px}.leg i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}
.pick{cursor:pointer}.pick:hover rect:first-child{fill-opacity:.4}.rl{fill:#8f9d97;font:600 12px Manrope}.bl{fill:#efe9dc;font:700 10px Manrope;text-anchor:middle}
#modal .ov{position:fixed;inset:0;background:rgba(4,8,7,.72);backdrop-filter:blur(6px);display:grid;place-items:center;z-index:50;padding:18px;overflow:auto}
.mod{background:var(--s1);border:1px solid var(--ln);border-radius:22px;padding:26px;width:min(560px,100%);box-shadow:0 30px 80px rgba(0,0,0,.55);animation:up .22s ease}
@keyframes up{from{opacity:0;transform:translateY(10px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.mh{display:flex;justify-content:space-between;align-items:start;margin-bottom:16px}.mh h3{font-size:26px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.f2>.full{grid-column:1/-1}.f2>div{min-width:0}
.note{display:flex;gap:11px;padding:13px 15px;border-radius:13px;background:#1d2a22;border:1px solid #31493b;color:#cfe0d4;font-size:13px;margin-top:14px}
.note.w{background:#2a2315;border-color:#5b4a26;color:#ecd9ae}
.adm{display:grid;grid-template-columns:230px 1fr;gap:26px;padding:34px 0 80px}
.adm aside{display:flex;flex-direction:column;gap:6px;position:sticky;top:90px;align-self:start}
.adm aside .btn{justify-content:flex-start;border-color:transparent;background:transparent;color:var(--mut)}.adm aside .btn.on{background:var(--s2);color:var(--tx);border-color:var(--ln)}
.stats{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.stat{padding:20px}.stat b{font:500 40px Fraunces,serif;display:block}.stat span{color:var(--mut);font-size:13px}
.tw{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{text-align:left;padding:13px 16px;border-bottom:1px solid var(--ln);vertical-align:middle}th{color:var(--mut);font-weight:600;font-size:12.5px}tr:last-child td{border:0}
.acts{display:flex;gap:6px;flex-wrap:wrap}.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:12px;flex-wrap:wrap}.bar h2{font-size:32px}
.mods{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin-top:16px}.mods .card{padding:20px}.mods h3{font-size:19px;margin:10px 0 6px}.mods p{color:var(--mut);font-size:13px}
.tool{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.tool select{width:auto;min-width:190px}
.ed{display:grid;grid-template-columns:150px 1fr 230px;gap:14px;align-items:start}.pal{display:flex;flex-direction:column;gap:6px}.pal .btn{justify-content:flex-start}
.panel{padding:16px;display:grid;gap:10px}.panel .f2{gap:10px}.empty{padding:50px;text-align:center;color:var(--mut)}
#toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,30px);opacity:0;background:var(--s2);border:1px solid var(--ln);padding:12px 20px;border-radius:13px;z-index:99;transition:.25s;pointer-events:none}#toast.show{opacity:1;transform:translate(-50%,0)}#toast.bad{border-color:var(--occ)}
footer{border-top:1px solid var(--ln);padding:30px 0;color:var(--mut);font-size:13px}
@media(max-width:900px){.two,.adm,.ed{grid-template-columns:1fr}.adm aside{position:static;flex-direction:row;overflow:auto}.pal{flex-direction:row;flex-wrap:wrap}.nav nav a span{display:none}.f2{grid-template-columns:1fr}}
</style></head><body>
<header class="nav"><div class="wrap"><a class="logo" href="#/"><i id="lg"></i>N.N Reddy Hostels</a><nav><a href="#/"><span>Hostels</span></a><a href="#/track" id="tk"></a><a href="#/admin" id="ad"></a></nav></div></header>
<main id="app"></main><div id="modal"></div><div id="toast"></div>
<footer><div class="wrap">N.N Reddy Hostels. Every space mapped, every bed accounted for. Powered by HostelAtlas.</div></footer>
<script>
const IC={building:'<path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2M10 6h4M10 10h4M10 14h4M10 18h4"/>',
bed:'<path d="M2 20v-8a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v8M4 10V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v4M12 4v6M2 18h20"/>',
pin:'<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>',
plus:'<path d="M5 12h14M12 5v14"/>',trash:'<path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
x:'<path d="M18 6 6 18M6 6l12 12"/>',check:'<path d="M20 6 9 17l-5-5"/>',
user:'<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
phone:'<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/>',
ext:'<path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',

lock:'<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
grid:'<path d="M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z"/>',
cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/>',
door:'<path d="M13 4h3a2 2 0 0 1 2 2v14M2 20h3M13 20h9M10 12v.01M13 4.6v16.1a1 1 0 0 1-1.2 1L5 20V5.6a2 2 0 0 1 1.5-1.9l4-1A2 2 0 0 1 13 4.6Z"/>',
win:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 12h18M12 3v18"/>',stairs:'<path d="M4 20h4v-4h4v-4h4V8h4"/>',
lift:'<rect x="4" y="2" width="16" height="20" rx="2"/><path d="m9 10 3-3 3 3M9 14l3 3 3-3"/>',
wind:'<path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2M9.6 4.6A2 2 0 1 1 11 8H2M12.6 19.4A2 2 0 1 0 14 16H2"/>',
bulb:'<path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5M9 18h6M10 22h4"/>',
rack:'<rect x="2" y="3" width="20" height="5" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8M10 12h4"/>',
drop:'<path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/>',
room:'<rect x="3" y="3" width="18" height="18" rx="2"/>',corr:'<path d="M3 9h18M3 15h18"/>',
save:'<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2zM17 21v-8H7v8M7 3v5h8"/>',
edit:'<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',wallet:'<path d="M20 12V8H6a2 2 0 0 1 0-4h12v4M4 6v12a2 2 0 0 0 2 2h14v-4M18 12a2 2 0 0 0 0 4h4v-4z"/>',
wrench:'<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.8-3.8a6 6 0 0 1-7.9 7.9l-6.9 6.9a2.1 2.1 0 0 1-3-3l6.9-6.9a6 6 0 0 1 7.9-7.9z"/>',
users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/><circle cx="9" cy="7" r="4"/>',
clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>'};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const I=(n,s=18)=>`<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;
$('#lg').innerHTML=I('building',20);$('#tk').innerHTML=I('search')+'<span>Track booking</span>';$('#ad').innerHTML=I('lock')+'<span>Admin</span>';
let tok=sessionStorage.getItem('t'),CUR=null,ED=null,AD={tab:'overview'};const A={};
const view=h=>{$('#app').innerHTML=h;scrollTo(0,0)},uid=()=>'o'+Math.random().toString(36).slice(2,9),go=h=>location.hash=h;
function toast(m,bad){const t=$('#toast');t.textContent=m;t.className='show'+(bad?' bad':'');clearTimeout(t._);t._=setTimeout(()=>t.className='',3200)}
async function api(a,d={}){const r=await fetch('/api/index',{method:'POST',headers:{'Content-Type':'application/json',...(tok?{Authorization:'Bearer '+tok}:{})},body:JSON.stringify({a,...d})});const j=await r.json().catch(()=>({error:'Network error'}));
 if(!r.ok){if(r.status===401&&a!=='login'){tok=null;sessionStorage.removeItem('t');go('#/admin')}throw new Error(j.error||'Request failed')}return j}
const modal=h=>$('#modal').innerHTML=`<div class="ov" data-ov><div class="mod" role="dialog" aria-modal="true">${h}</div></div>`;
const mh=t=>`<div class="mh"><h3>${t}</h3><button class="btn sm o" data-act="close" aria-label="Close">${I('x',16)}</button></div>`;
document.addEventListener('click',async e=>{if(e.target.dataset.ov!==undefined)return A.close();const t=e.target.closest('[data-act]');if(!t||!A[t.dataset.act])return;
 try{await A[t.dataset.act](t.dataset,t)}catch(x){toast(x.message,1);t.disabled=false}});
document.addEventListener('keydown',e=>{const t=e.target.closest?.('[data-act][tabindex]');if(t&&(e.key==='Enter'||e.key===' ')){e.preventDefault();t.dispatchEvent(new MouseEvent('click',{bubbles:true}))}
 if(e.key==='Escape')A.close();if(e.key==='Delete'&&ED?.sel&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))A.delObj()});
A.close=()=>$('#modal').innerHTML='';
const LBL={available:'Available',hold:'On hold',reserved:'Reserved',occupied:'Occupied',unavailable:'Unavailable'},COL={available:'#52c9a3',hold:'#e6a94a',reserved:'#8091ff',occupied:'#e8627c',unavailable:'#4c5753'};
const legend=()=>`<div class="leg">${Object.keys(LBL).map(k=>`<span><i style="background:${COL[k]}"></i>${LBL[k]}</span>`).join('')}</div>`;
const mapSrc=h=>`https://maps.google.com/maps?q=${h.lat!=null?h.lat+','+h.lng:encodeURIComponent([h.name,h.address,h.city].filter(Boolean).join(', '))}&z=16&output=embed`;
const safe=u=>/^https?:\/\//i.test(u||'')?u:'',openUrl=h=>safe(h.maps_url)||`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent([h.name,h.address,h.city].filter(Boolean).join(', '))}`;
const payNote=p=>`<div class="note w">${I('wallet')}<div>Online payments are under development. Please pay the rent and deposit directly to the hostel owner${p?` (<a href="tel:${esc(p)}">${esc(p)}</a>)`:''}. Your bed is confirmed only after staff verify your documents and payment.</div></div>`;
const bg=u=>safe(u)?`style="background-image:url('${esc(u).replace(/'/g,'%27')}')"`:'';
/* ---------- floor plan ---------- */
const PAL=[['room','Room','room'],['corridor','Corridor','corr'],['bed','Bed','bed'],['washroom','Washroom','drop'],['door','Door','door'],['window','Window','win'],['stairs','Stairs','stairs'],['lift','Lift','lift'],['fan','Fan','wind'],['light','Light','bulb'],['rack','Rack','rack'],['balcony','Balcony','grid']];
const DEF={room:[240,160,'Room'],corridor:[400,60,'Corridor'],bed:[36,80,''],washroom:[100,90,'WC'],door:[40,40,'Door'],window:[60,8,'Window'],stairs:[80,100,'Stairs'],lift:[60,60,'Lift'],fan:[36,36,'Fan'],light:[20,20,'Light'],rack:[60,24,'Rack'],balcony:[200,60,'Balcony']};
function shape(o,st){const{t,w,h}=o,l=esc(o.l),T=(x,y,s)=>`<text x="${x}" y="${y}" class="rl" ${s||''}>${l}</text>`;
 switch(t){case'room':return`<rect width="${w}" height="${h}" rx="4" fill="rgba(239,233,220,.025)" stroke="#5c6e67" stroke-width="2.5"/>${T(10,20)}`;
 case'corridor':return`<rect width="${w}" height="${h}" rx="4" fill="rgba(239,233,220,.04)" stroke="#3b4a45" stroke-dasharray="6 5"/>${T(10,h/2+4)}`;
 case'balcony':return`<rect width="${w}" height="${h}" rx="4" fill="none" stroke="#7d8f87" stroke-dasharray="3 5" stroke-width="2"/>${T(10,20)}`;
 case'washroom':return`<rect width="${w}" height="${h}" rx="4" fill="rgba(82,201,163,.07)" stroke="#3f8f78" stroke-width="2"/>${T(w/2,h/2+4,'text-anchor="middle"')}`;
 case'bed':{const c=COL[st],ph=Math.min(14,h*.22);return`<rect width="${w}" height="${h}" rx="6" fill="${c}" fill-opacity=".2" stroke="${c}" stroke-width="2"${st==='hold'?' stroke-dasharray="5 3"':''}/><rect x="4" y="4" width="${w-8}" height="${ph}" rx="4" fill="${c}" fill-opacity=".65"/><text x="${w/2}" y="${h/2+ph/2+4}" class="bl">${esc(o.code)}</text>`}
 case'door':return`<path d="M0 0H${w}" stroke="#d8b98a" stroke-width="4"/><path d="M${w} 0A${w} ${w} 0 0 1 0 ${w}" fill="none" stroke="#d8b98a" stroke-opacity=".5" stroke-dasharray="3 3"/>`;
 case'window':return`<rect width="${w}" height="${h}" fill="#7fb3d5" fill-opacity=".35" stroke="#7fb3d5" stroke-width="2"/>`;
 case'stairs':return`<rect width="${w}" height="${h}" fill="none" stroke="#8f9d97" stroke-width="2"/>${Array.from({length:Math.floor(h/10)},(_,i)=>`<path d="M0 ${i*10+10}H${w}" stroke="#8f9d97" stroke-opacity=".6"/>`).join('')}${T(w/2,h/2+4,'text-anchor="middle"')}`;
 case'lift':return`<rect width="${w}" height="${h}" fill="none" stroke="#8f9d97" stroke-width="2"/><path d="M0 0 ${w} ${h}M${w} 0 0 ${h}" stroke="#8f9d97" stroke-opacity=".5"/>`;
 case'fan':{const r=Math.min(w,h)/2;return`<g transform="translate(${w/2} ${h/2})" stroke="#d8b98a" stroke-width="2" fill="none"><circle r="${r}" stroke-opacity=".4"/><path d="M0 0 ${r*.9} 0M0 0-${r*.9} 0M0 0 0 ${r*.9}M0 0 0-${r*.9}"/></g>`}
 case'light':return`<circle cx="${w/2}" cy="${h/2}" r="${Math.min(w,h)/2-1}" fill="#f0dcb6" fill-opacity=".35" stroke="#f0dcb6"/>`;

async function router(){const h=location.hash||'#/';try{if(h.startsWith('#/h/'))await hostelPage(h.slice(4));else if(h==='#/track')trackPage();else if(h.startsWith('#/admin'))await admin();else await home()}catch(e){view(`<div class="wrap"><div class="card empty" style="margin-top:40px">${esc(e.message)}</div></div>`)}}
addEventListener('hashchange',router);router();
</script>

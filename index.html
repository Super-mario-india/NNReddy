 try{await A[t.dataset.act](t.dataset,t,e)}catch(x){if(x!==STALE)toast(x.message,1)}finally{if(b){delete b.dataset.busy;b.disabled=false}}});

 case'washroom':return`<rect width="${w}" height="${h}" rx="4" class="p-wc"/>${T(w/2,h/2+4,'text-anchor="middle"')}`;
 case'bed':{const ph=Math.min(14,h*.22);return`<g class="bed ${(LIVE[st]||LIVE.unavailable)[0]}"><rect class="bb" width="${w}" height="${h}" rx="6"/><rect class="bp2" x="4" y="4" width="${Math.max(w-8,1)}" height="${ph}" rx="4"/><text x="${w/2}" y="${h/2+ph/2+4}">${esc(o.code)}</text></g>`}
 case'door':return`<path d="M0 0H${w}" class="p-door"/><path d="M${w} 0A${w} ${w} 0 0 1 0 ${w}" class="p-swing"/>`;

function planSVG(objs,o={}){const bm=o.bm||{};let x1=0,y1=0,x2=1000,y2=640;
 if(objs.length){x1=Math.min(...objs.map(b=>b.x))-30;y1=Math.min(...objs.map(b=>b.y))-30;x2=Math.max(...objs.map(b=>b.x+b.w))+30;y2=Math.max(...objs.map(b=>b.y+b.h))+30}
 const g=objs.map(ob=>{const bd=ob.t==='bed',b=bd?bm[ob.code]:null,st=bd?(b?.live||'unavailable'):'',pick=o.pick&&b&&st==='available';
  return`<g transform="translate(${ob.x} ${ob.y}) rotate(${ob.r||0} ${ob.w/2} ${ob.h/2})"${pick?` data-act="bed" data-id="${esc(b.id)}" tabindex="0" role="button" aria-label="Bed ${esc(ob.code)}${b.price?', '+money(b.price)+' per month':''}" class="pk${o.sel===b.id?' sel':''}"`:''}>${bd?`<title>${esc(ob.code)}: ${(LIVE[st]||LIVE.unavailable)[1]}${b?.price?' · '+money(b.price)+'/month':''}</title>`:''}${shape(ob,st)}</g>`}).join('');
 return`<svg viewBox="${x1} ${y1} ${x2-x1} ${y2-y1}" class="plan" role="img" aria-label="Floor plan">${g}</svg>`}

function meStay(a,sw){const h=a.hostels||{},i=ORDER.indexOf(a.status),R=(l,v)=>v?`<div class="li"><span>${l}</span><b>${esc(v)}</b></div>`:'';

 return`<div class="ph">${chip(SCH[a.status]?.[0]||'--na',h.name||'Hostel')}<h1>Hi, ${esc((a.name||'').split(' ')[0])}</h1><p>${a.bed_code?'Bed '+esc(a.bed_code)+' · ':''}Applied ${day(a.created_at)}</p></div>${sw}
 ${a.status==='rejected'?lockC('Application not approved','Please contact the hostel if you have questions.','','info'):a.status==='left'?lockC('You have checked out','Thank you for staying with us.','','home'):tl}
 ${a.status==='approved'?`<div class="sec">Choose your bed</div><div class="card" id="pv"><div class="empty">Loading the floor plan…</div></div><p class="fine" style="margin:10px 4px 0">Tap a green bed, then reserve it at the bottom of the screen. You can choose only once.</p>`:''}
 <div class="sec">Your details</div><div class="card pd">${R('Name',a.name)}${R('Mobile',a.phone)}${R('Email',a.email)}${R('Aadhaar',a.aadhaar&&'XXXX XXXX '+a.aadhaar.slice(-4))}${R('Parent or guardian',a.parent_name)}${R('Parent mobile',a.parent_phone)}${R('Address',a.address)}${R('Purpose',a.purpose)}${R('College',a.college)}${R('Office',a.office)}${R('Joining',a.join_date&&day(a.join_date))}</div>
 ${h.phone?`<div class="sec">Hostel contact</div><div class="card pd"><div class="li"><span>Phone</span><b><a href="tel:${esc(h.phone)}">${esc(h.phone)}</a></b></div></div>`:''}
 <button class="btn bs bw" style="margin-top:22px" data-act="signout">${I('out',16)}Sign out</button>`}
function meFees(a,sw){const h=a.hostels||{},i=ORDER.indexOf(a.status),due=a.amount_due||0,bal=Math.max(0,due-(a.paid_amount||0)),late=a.status==='assigned'&&a.due_at&&new Date(a.due_at)<new Date();
 const top=`<div class="ph"><h1>Fees</h1><p>${esc(h.name||'')}${i>=2?(a.plan==='bed_only'?' · Bed only':' · With food'):''}</p></div>${sw}`;
 if(i<2)return top+lockC('Fee details are not ready yet','They appear once your bed is reserved.','','wal');
 const st=a.status==='assigned'?(late?['--occ','Overdue']:['--hold','Payment due']):a.status==='paid'?['--hold','Being verified']:bal?['--hold','Balance due']:['--ok','Paid up'];
 return`${top}<div class="card big"><small>${a.status==='assigned'?'Amount to pay':'Balance due'}</small><b>${money(a.status==='assigned'?due:bal)}</b><div class="row8">${chip(...st)}${a.status==='assigned'&&a.due_at?`<span class="mu" style="font-size:13.5px">Pay by ${dt(a.due_at)}</span>`:''}</div></div>
 <div class="st" style="margin-top:12px"><div class="card"><small>Fee</small><b>${money(due)}</b></div><div class="card"><small>Paid</small><b>${money(a.paid_amount)}</b></div></div>
 ${a.status==='assigned'?`<div class="sec">Submit your payment</div><div class="card pd"><p class="mu" style="margin-bottom:14px">Pay ${money(due)} to the hostel owner${h.phone?` (<a href="tel:${esc(h.phone)}">${esc(h.phone)}</a>)`:''} by UPI, then enter the UPI transaction ID from your payment app.</p>${FL('p_ref','UPI transaction ID','text','','autocomplete="off" data-enter="pay"')}<button class="btn bp bw" data-act="pay" data-id="${esc(a.id)}">Submit payment</button></div>`:''}
 ${a.status==='paid'?`<div class="note">${I('clock',20)}<div>Payment reference <b>${esc(a.paid_ref||'')}</b> submitted. The hostel will confirm it soon.</div></div>`:''}
 ${a.verified_at?`<div class="note">${I('check',20)}<div>Payment of <b>${money(a.paid_amount)}</b> verified on ${day(a.verified_at)}.</div></div>`:''}
 <div class="note">${I('info',20)}<div>Online card and UPI checkout is coming soon. Until then, pay the hostel owner directly and keep your receipt.</div></div>`}
A.pay=async d=>{const ref=val('p_ref');if(ref.length<4)fail('p_ref','Enter the UPI transaction ID from your payment app');await api('pay',{app_id:d.id,ref});toast('Payment submitted');router()};

 return`${top}${res?`<div class="card pd">${SEL('rq_c','Category',['Electrical','Plumbing','Cleaning','Wi-Fi','Furniture','Food','Other'])}${FL('rq_t','What is the problem?','text','','maxlength="100"')}${TA('rq_d','More details (optional)')}<button class="btn bp bw" data-act="ticket" data-id="${esc(a.id)}">Send request</button></div><div class="sec">Your requests</div>`:''}
 ${tk.map(t=>`<div class="card it"><div class="r"><div><b>${esc(t.title)}</b><small>${day(t.created_at)}</small>${t.detail?`<p class="dtl">${esc(t.detail)}</p>`:''}</div>${chip(...(TCH[t.status]||TCH.open))}</div>${t.reply?`<div class="reply">${I('user',14)}<span><b>Hostel:</b> ${esc(t.reply)}</span></div>`:''}</div>`).join('')||'<p class="mu pl4">No requests yet.</p>'}`}

 el.innerHTML=f?`${floors.length>1?`<div class="pvs">${segH('plFl',floors.map((x,i)=>[i,`${esc(x.name)} · ${free(x)}`]),P.fi)}</div>`:''}<div class="pw"><div class="vp">${planSVG(f.layout?.objs||[],{bm,pick:1,sel:S.sel?.id})}</div></div>${legend()}`:'<div class="empty">The floor plan will be published soon. The hostel can also assign a bed for you.</div>';syncAll()}
A.plFl=d=>{S.pl.fi=+d.v;bar();drawPlan()};
A.bed=d=>{const b=S.pl?.d.beds.find(x=>x.id===d.id);if(!b)return;S.sel=b;$$('.pk').forEach(x=>x.classList.toggle('sel',x.dataset.id===b.id));bar('Bed '+b.code,b.price?money(b.price)+' per month':'Selected bed')};

A.rBed=(d,t)=>{const b=S.AD.free.find(x=>x.id===t.value);if(b?.price)$('#o_a').value=b.price};
A.rAssignGo=async d=>{const amt=val('o_a');if(amt===''||!(+amt>=0))fail('o_a','Enter the fee amount');await api('assign',{id:d.id,bed_id:val('o_b'),amount:amt,due_at:dueISO()});resDone('Bed assigned and resident notified')};
A.rFee=d=>{const a=findA(d.id);sheet('Fee and due date',a.name,`${FL('o_a','Fee (₹)','number',a.amount_due??'','inputmode="numeric" min="0"')}<label class="lb" for="o_d">Pay before</label><input class="fi" id="o_d" type="datetime-local" value="${local(a.due_at)}"><label class="lb" for="o_p">Plan</label><select class="fi" id="o_p"><option value="full"${a.plan!=='bed_only'?' selected':''}>With food</option><option value="bed_only"${a.plan==='bed_only'?' selected':''}>Bed only (no food)</option></select><button class="btn bp bw" data-act="rFeeGo" data-id="${esc(a.id)}">Save</button>`)};
A.rFeeGo=async d=>{const amt=val('o_a');if(amt===''||!(+amt>=0))fail('o_a','Enter the fee amount');await api('set_fee',{id:d.id,amount:amt,plan:val('o_p'),due_at:dueISO()});resDone('Fee updated')};
A.rVerify=d=>{const a=findA(d.id);sheet('Verify payment',a.name,`<div class="rv2"><div><span>Fee</span><b>${money(a.amount_due)}</b></div><div><span>Payment reference</span><b>${esc(a.paid_ref||'Not submitted (paid in cash or directly)')}</b></div></div>${FL('o_v','Amount received (₹)','number',a.amount_due??'','inputmode="numeric" min="0"')}<button class="btn bp bw" data-act="rVerifyGo" data-id="${esc(a.id)}">Mark payment as verified</button>`)};
A.rVerifyGo=async d=>{const v=val('o_v');if(v===''||!(+v>=0))fail('o_v','Enter the amount received');await api('verify',{id:d.id,paid:v});resDone('Payment verified')};
A.rIn=async d=>{const a=findA(d.id);if(!await confirmUI(`Check in ${a.name}?`,'Marks the bed as occupied and emails a welcome note.','Check in'))return;await api('checkin',{id:d.id});resDone('Checked in')};
A.rOut=async d=>{const a=findA(d.id),res=a.status==='resident';if(!await confirmUI(res?`Check out ${a.name}?`:`Release the bed held by ${a.name}?`,res?'The bed becomes free for new applicants.':'They have not moved in yet. The bed becomes free and their application closes.',res?'Check out':'Release bed','danger'))return;await api('checkout',{id:d.id});resDone(res?'Checked out':'Bed released')};
function aReq(){const ts=S.AD.ts;return`<div class="ph"><h1>Requests</h1><p>Maintenance problems reported by residents.</p></div>${Object.keys(TCH).map(k=>{const L=ts.filter(t=>(TCH[t.status]?t.status:'open')===k);return`<div class="sec">${TCH[k][1]} · ${L.length}</div>${L.map(t=>`<div class="card it"><div class="r"><div><b>${esc(t.title)}</b><small>${esc(t.applications?.name||'')} · ${esc(t.hostels?.name||'')} · ${dt(t.created_at)}</small>${t.detail?`<p class="dtl">${esc(t.detail)}</p>`:''}</div>${chip(...TCH[k])}</div>
 <div class="tkf"><select class="fi sm" id="ts_${esc(t.id)}" aria-label="Status">${Object.keys(TCH).map(s=>`<option value="${s}"${s===k?' selected':''}>${TCH[s][1]}</option>`).join('')}</select><input class="fi sm" id="tr_${esc(t.id)}" placeholder="Reply to the resident" aria-label="Reply" value="${esc(t.reply)}" maxlength="500"><button class="btn bp bm" data-act="tSave" data-id="${esc(t.id)}">Save</button></div></div>`).join('')||'<p class="mu pl4">None.</p>'}`}).join('')}`}
A.tSave=async d=>{await api('set_ticket',{id:d.id,status:val('ts_'+d.id),reply:val('tr_'+d.id)});S.AD.ts=await api('tickets');toast('Request updated');rerender()};
function aHostels(){return`<div class="ph r" style="align-items:flex-end;flex-wrap:wrap"><div><h1>Hostels</h1><p>Details shown on the public website.</p></div><button class="btn bp" data-act="hForm">${I('plus',16)}Add hostel</button></div><div class="grid">${S.AD.hs.map(h=>{const n=Object.values(h.stat||{}).reduce((a,b)=>a+b,0);return`<div class="card">${cover(h,1)}<div class="pd" style="padding:14px 18px"><div class="row8" style="margin-bottom:12px">${h.lat!=null?chip('--ok','Map linked'):addrOf(h)?chip('--hold','Map from address'):chip('--na','No location')}${chip('--res',n+' bed'+(n===1?'':'s'))}</div>
 <div class="row8"><button class="btn bs bm" data-act="hForm" data-id="${esc(h.id)}">${I('edit',15)}Edit</button><a class="btn bs bm" href="#/h/${esc(h.id)}" target="_blank" rel="noopener">${I('ext',15)}View</a><button class="btn bd2 bm" data-act="hDel" data-id="${esc(h.id)}" aria-label="Delete ${esc(h.name)}">${I('trash',15)}</button></div></div></div>`}).join('')||'<div class="card empty" style="grid-column:1/-1">Add your first hostel to begin.</div>'}</div>`}
A.hForm=d=>{const h=S.AD.hs.find(x=>x.id===d.id)||{};sheet(h.id?'Edit hostel':'Add hostel',h.name||'Shown on the public website',`${FL('f_name','Hostel name','text',h.name)}<div class="g2">${FL('f_city','Area or city','text',h.city)}${FL('f_phone','Owner or reception phone','tel',h.phone)}</div>${TA('f_address','Full address',h.address)}${FL('f_maps_url','Google Maps link','text',h.maps_url)}<p class="fine">Paste a Google Maps share link (long, short or embed code). Leave it empty to place the map from the address.</p>${FL('f_image_url','Cover image link (https://…)','url',h.image_url)}${FL('f_amenities','Facilities, separated by commas','text',h.amenities)}${TA('f_description','Description',h.description)}<button class="btn bp bw" data-act="hSave" data-id="${esc(h.id||'')}">${I('save',16)}Save hostel</button>`)};
A.hSave=async d=>{if(!val('f_name'))fail('f_name','Hostel name is required');if(val('f_image_url')&&!safe(val('f_image_url')))fail('f_image_url','The image link must start with https://');const p={id:d.id||undefined};['name','city','phone','address','maps_url','image_url','amenities','description'].forEach(k=>p[k]=val('f_'+k));
 await api('save_hostel',p);closeSheet();S.AD.hs=await api('hostels');S.hs=null;toast('Hostel saved');rerender()};
A.hDel=async d=>{const h=S.AD.hs.find(x=>x.id===d.id);if(!await confirmUI(`Delete ${h?.name||'this hostel'}?`,'Its floors and beds are removed too. Hostels with bookings or applications cannot be deleted.','Delete','danger'))return;await api('del_hostel',{id:d.id});S.AD.hs=await api('hostels');S.hs=null;toast('Hostel deleted');rerender()};
function aMail(){const s=S.AD.set||{},ok=s.user&&s.pass;return`<div class="ph"><h1>Email</h1><p>Used for applicant sign-in codes and notifications.</p></div><div class="card pd">${ok?`<div class="note" style="margin:0 0 16px">${I('check',20)}<div>Email is set up. Applicants can sign in with a code.</div></div>`:`<div class="note warn" style="margin:0 0 16px">${I('info',20)}<div><b>Applicants cannot sign in until email is set up.</b> Use a Gmail address with 2-step verification and an app password (Google Account, Security, App passwords).</div></div>`}
 <div class="g2">${FL('m_user','Gmail address','email',s.user)}${FL('m_pass','Gmail app password','password',s.pass,'autocomplete="new-password"')}</div>${FL('m_from','Sender, e.g. N.N Reddy Hostels <you@gmail.com> (optional)','text',s.from)}${FL('m_admin_email','Send new-application alerts to','email',s.admin_email)}${FL('m_site_url','Website address','url',s.site_url||location.origin)}
 <div class="row8" style="margin-top:6px"><button class="btn bp" data-act="mSave">${I('save',16)}Save</button><button class="btn bs" data-act="mTest">Send test email</button></div></div>`}
A.mSave=async()=>{await api('save_settings',Object.fromEntries(['user','pass','from','admin_email','site_url'].map(k=>[k,val('m_'+k)])));S.AD.set=await api('get_settings');toast('Email settings saved');rerender()};
A.mTest=async()=>{await A.mSave();await api('test_mail');toast('Test email sent. Check the inbox.')};
const BK={pending:['--hold','Under review'],approved:['--res','Approved'],confirmed:['--ok','Confirmed'],checked_in:['--ok','Checked in'],checked_out:['--na','Checked out'],rejected:['--occ','Rejected'],cancelled:['--occ','Cancelled']};
const NEXT=b=>({pending:[['approved','Approve','bp'],['rejected','Reject','bs']],approved:[...(b.verification==='verified'?[['confirmed','Confirm admission','bp']]:[['v','Mark verified','bp'],['vf','Verification failed','bs']]),['cancelled','Cancel','bd2']],confirmed:[['checked_in','Check in','bp'],['cancelled','Cancel','bd2']],checked_in:[['checked_out','Check out','bp']]}[b.status]||[]);
function aLegacy(){return`<div class="ph"><h1>Old bookings</h1><p>Requests from the earlier self-service booking flow.</p></div>${S.AD.bk.map(b=>`<div class="card it"><div class="r"><div><b>${esc(b.name)}</b><small>${esc(b.hostels?.name||'')} · Bed ${esc(b.beds?.code||'-')} · from ${day(b.move_in)} for ${esc(b.months)} mo</small><small>${esc(b.phone)} · ${esc(b.email)}</small></div><div class="row8" style="justify-content:flex-end">${chip(...(BK[b.status]||['--na',b.status]))}${['approved','confirmed'].includes(b.status)?chip(b.verification==='verified'?'--ok':'--hold',b.verification==='verified'?'Verified':'Verification pending'):''}</div></div>
 <div class="ac">${NEXT(b).map(n=>`<button class="btn ${n[2]} bm" data-act="bkGo" data-id="${esc(b.id)}" data-s="${n[0]}">${n[1]}</button>`).join('')}</div></div>`).join('')}`}
A.bkGo=async d=>{const p={id:d.id};if(d.s==='v')p.verification='verified';else if(d.s==='vf')p.verification='failed';else p.status=d.s;await api('set_booking',p);S.AD.bk=await api('bookings');toast('Booking updated');rerender()};

/* ---------- router ---------- */
function go(h){location.hash===h?setTimeout(router):location.hash=h}
async function router(){const p=location.hash.replace(/^#\/?/,'').split('/').map(x=>{try{return decodeURIComponent(x)}catch(e){return x}}),rt=++S.rt;
 closeSheet();bar();S.mode=p[0]==='admin'?'admin':'user';$('#app').classList.toggle('wide',S.mode==='admin');document.title='N.N Reddy Hostels';head();navbar(p);scrollTo(0,0);
 try{if(p[0]==='h'&&p[1])await hostelPage(p[1]);else if(p[0]==='me')await mePage(p[1]||'stay');else if(p[0]==='admin')await adminPage(p[1]||'overview');else await homePage()}
 catch(e){if(e!==STALE&&rt===S.rt)view(`<div style="margin-top:30px">${lockC('Something went wrong',e.message,`<button class="btn bp" style="margin-top:16px" data-act="retry">Try again</button>`,'info')}</div>`)}}
A.retry=()=>router();
let lastHash=location.hash,skipHash=0;
addEventListener('hashchange',()=>{if(skipHash){skipHash=0;return}
 if(window.PE?.dirty&&lastHash.startsWith('#/admin/plans')&&!location.hash.startsWith('#/admin/plans')){if(!confirm('Discard unsaved changes on this floor?')){skipHash=1;location.hash=lastHash;return}PE.reset()}
 lastHash=location.hash;router()});
head();router();
</script>
